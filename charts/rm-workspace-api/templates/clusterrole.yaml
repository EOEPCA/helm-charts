apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ .Release.Namespace }}-{{ include "rm-workspace-api.fullname" . }}-configuration
  labels:
    {{- include "rm-workspace-api.labels" . | nindent 4 }}
rules:
  - apiGroups: ["apiextensions.crossplane.io"]
    resources:
      - compositions
      - environmentconfigs
    verbs: ["get", "list"]
