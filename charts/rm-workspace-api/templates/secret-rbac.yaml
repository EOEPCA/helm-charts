{{- range $namespace := .Values.secretNamespaces | uniq }}
{{- if ne $namespace $.Release.Namespace }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "rm-workspace-api.fullname" $ }}-secrets
  namespace: {{ $namespace | quote }}
  labels:
    {{- include "rm-workspace-api.labels" $ | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "rm-workspace-api.fullname" $ }}-secrets
  namespace: {{ $namespace | quote }}
  labels:
    {{- include "rm-workspace-api.labels" $ | nindent 4 }}
subjects:
  - kind: ServiceAccount
    name: {{ include "rm-workspace-api.serviceAccountName" $ }}
    namespace: {{ $.Release.Namespace }}
roleRef:
  kind: Role
  name: {{ include "rm-workspace-api.fullname" $ }}-secrets
  apiGroup: rbac.authorization.k8s.io
{{- end }}
{{- end }}
