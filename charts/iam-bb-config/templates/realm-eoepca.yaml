{{ if .Values.iam.keycloak.configuration.useCrossplane -}}
{{ if .Values.iam.keycloak.configuration.realm.createUsingCrossplane -}}
apiVersion: realm.keycloak.m.crossplane.io/v1alpha1
kind: Realm
metadata:
  name: {{ printf "%s-eoepca-realm" .Release.Name }}
  namespace: {{ .Values.iam.config.targetNamespace | default .Release.Namespace }}
spec:
  # Do not accidentally delete the realm...
  managementPolicies: ["Create", "Update", "Observe", "LateInitialize"]
  forProvider:
    realm: {{- .Values.iam.keycloak.configuration.realm.name | quote }}
    displayName: {{- .Values.iam.keycloak.configuration.realm.displayName | quote }}
  providerConfigRef:
    #kind: ProviderConfig
    name: {{ .Values.iam.keycloak.configuration.provider.existingConfigRef | default "keycloak-provider-config" }}
{{- end }}
{{- end }}