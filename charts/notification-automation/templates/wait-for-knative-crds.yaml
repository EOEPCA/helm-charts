{{- if .Values.eventing.install }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Release.Name }}-wait-for-crds
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: wait-for-crds
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/managed-by: {{ .Release.Service }}
  annotations:
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-weight": "-10"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ .Release.Name }}-wait-for-crds
  labels:
    app.kubernetes.io/name: wait-for-crds
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/managed-by: {{ .Release.Service }}
  annotations:
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-weight": "-10"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
rules:
  - apiGroups: ["apiextensions.k8s.io"]
    resources: ["customresourcedefinitions"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ .Release.Name }}-wait-for-crds
  labels:
    app.kubernetes.io/name: wait-for-crds
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/managed-by: {{ .Release.Service }}
  annotations:
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-weight": "-10"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ .Release.Name }}-wait-for-crds
subjects:
  - kind: ServiceAccount
    name: {{ .Release.Name }}-wait-for-crds
    namespace: {{ .Release.Namespace }}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ .Release.Name }}-wait-for-crds
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: wait-for-crds
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/managed-by: {{ .Release.Service }}
  annotations:
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-weight": "-5"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  backoffLimit: 10
  activeDeadlineSeconds: {{ .Values.eventing.waitForCRDs.timeoutSeconds | default 300 }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: wait-for-crds
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      serviceAccountName: {{ .Release.Name }}-wait-for-crds
      restartPolicy: OnFailure
      containers:
        - name: wait
          image: {{ .Values.eventing.waitForCRDs.image | default "bitnami/kubectl:latest" }}
          command:
            - /bin/sh
            - -c
            - |
              echo "Waiting for Knative Eventing CRDs to be established..."
              CRDS="brokers.eventing.knative.dev sinkbindings.sources.knative.dev triggers.eventing.knative.dev"
              for crd in $CRDS; do
                echo "Waiting for CRD: $crd"
                until kubectl get crd "$crd" -o jsonpath='{.status.conditions[?(@.type=="Established")].status}' 2>/dev/null | grep -q "True"; do
                  echo "  $crd not yet established, retrying in 5s..."
                  sleep 5
                done
                echo "  $crd is established."
              done
              echo "All Knative Eventing CRDs are ready."
{{- end }}
