# Default values for iam-bb.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

global:
  security:
    # Required for Keycloak custom image with OPA adapter
    allowInsecureImages: true

# Settings for the IAM BB chart as a whole.
# Some settings made here are propagated to the service-specific sections
# through anchors. Make sure not to remove the anchors and references,
# because otherwise the dependent values will not be set.
# Note that further adaptations may still be needed in the service-specific
# sections below.
iam: &iam
  keycloak:
    enabled: true
    createRoute: true
    # "Official" Keycloak URL (used everywhere where Keycloak needs to be addressed)
    url: &kcurl https://iam-auth.develop.eoepca.org
    # Deviating "internal" Keycloak URL to use for cluster-internal access
    # (defaults to official URL). Only used for Crossplane provider so far.
    # Useful to prevent Crossplane-related traffic from going through APISIX.
    # Also useful for test environments that do not use official certs.
    internalUrl: ""
    hosts:
      - iam-auth.develop.eoepca.org
    paths:
      - /*
    # Array of path prefixes to strip. Useful for path-based routing.
    stripPaths: ~
    # Additional configuration to apply to Keycloak.
    # Partially evaluated by the iam-bb-config Helm chart.
    # By default, the EOEPCA realm and a user account for Crossplane
    # are initialized via the Keycloak operator, whereas further
    # configuration (like clients, groups etc.) should be applied via
    # the Crossplane Keycloak Provider.
    configuration:
      # Set this to true to enable generation of Crossplane CRs;
      # if set to false, Crossplane is not used and no CRs are generated.
      useCrossplane: false
      # Set this to true to enable Keycloak Config CLI for initial realm
      # setup. NOT SUPPORTED ANY MORE since EOEPCA 2.1!
      #useKeycloakConfigCli: false
      # Set to true to generate secrets using kubernetes-secret-generator;
      # Set to false (default) to generate them using Helm random functions.
      useSecretGenerator: false
      # Set to true to auto-generate clients as Crossplane CRs.
      createClients: true
      # Specifies if a secret store shall be created. The special value "auto"
      # (default) means that a store is created automatically if needed
      # (depending on iam.config.targetNamespace and iam.config.propagateSecrets).
      # Set this to true if you want to force the Helm chart to create the store
      # or to false if you want to prevent it from doing so, e.g. because
      # ESO is not available on the cluster.
      createSecretStore: "auto"
      # Allows specifying the namespaces that may access the generated
      # ClusterSecretStore as an array. Defaults to [iam.config.targetNamespace]
      # if unset.
      secretStoreClientNamespaces: ~
      realm:
        # Set to true to auto-generate KeycloakRealmImport resource.
        # NOTE: As of EOEPCA 2.1, this option changed its semantics.
        # In EOEPCA 2.0 it allowed creating the realm via Crossplane.
        # This possibility was not really useful and will therefore be dropped.
        create: true
        # Preliminary option to allow Crossplane-based realm creation
        # until its final removal
        # DEPRECATED
        createUsingCrossplane: false
        # Name of realm to create or of existing realm to create clients in
        name: eoepca
        displayName: EOEPCA
        # Declaration of placeholders used in customClients, customUsers and customSettings
        customPlaceholders: ~
          # Example:
          #placeholder_name:
          #  secret:
          #    name: secret-name
          #    key: key-name
        # Array of custom clients to create during initial realm initialization.
        # This allows creating clients that are not managed by Crossplane.
        # Note: This is only honoured during initial realm initialization.
        # Realm updates are not supported.
        customClients: []
        # Array of custom users to create during initial realm initialization.
        # This allows creating users that are not managed by Crossplane.
        # Note: This is only honoured during initial realm initialization.
        # Realm updates are not supported.
        customUsers: []
        # Additional custom realm settings. May contain any top-level realm
        # attributes except those covered by the settings above.
        # Note: This is only honoured during initial realm initialization.
        # Realm updates are not supported.
        customSettings:
          loginWithEmailAllowed: false
          # Useful sections include:
          #identityProviders: []
          #identityProviderMappers: []
          #requiredActions: []
          # The following example demonstrates how to configure the SMTP server
          # for outgoing e-mails:
          #smtpServer:
          #  password: "**********"
          #  replyToDisplayName: ""
          #  starttls: "true"
          #  auth: "true"
          #  port: "587"
          #  replyTo: ""
          #  host: "smtp.gmail.com"
          #  from: "eoepca@gmail.com"
          #  fromDisplayName: "Eoepca Develop Cluster"
          #  envelopeFrom: ""
          #  ssl: "false"
          #  user: "eoepca@gmail.com"
      provider:
        # Reference to existing ProviderConfig to use (instead of creating own one)
        existingConfigRef: ""
        # Set to true to generate ProviderConfig for Keycloak (only honoured if
        # useCrossplane is true)
        create: true
        # Set to true to create a client with service account to be used by Crossplane
        # Keycloak Provider. (only honoured if realm.create is true, but
        # independent of useCrossplane setting)
        createServiceAccount: false
        # Client secret for the Crossplane Keycloak Provider client.
        # Unfortunately it is currently not possible to generate this secret via
        # kubernetes-secret-generator. Therefore it must either be specified here
        # or provided through an existing secret. Having the secret generated by
        # Helm is possible, but not recommended, because updates are not handled
        # properly.
        clientSecret: ""
        # Reference to existing secret containing Keycloak location and credentials
        secretRef:
          name: "" #keycloak-credentials
          key: "" #credentials
          #namespace: "" #crossplane-system
    tls:
      # Set to true to use TLS on route from APISIX to Keycloak
      # Make sure to also configure keycloak-operator.keycloak.http.tlsSecret
      # if you set this option to true.
      enabled: false
      # Set to true to autogenerate a TLS certificate for Keycloak.
      autoGenerate: true
      # Name of TLS secret to use. Set to existing secret of your choice or to
      # "keycloak-tls" to refer to the autogenerated TLS cert.
      # Leave empty if TLS is disabled.
      tlsSecretRef: &tlsSecretRef ~
      #tlsSecretRef: &tlsSecretRef keycloak-tls
    cors:
      # Set this to true to enable CORS
      enabled: false
      # Allowed origin(s). Can be string or comma-separated list:
      #   - string: "*" or "https://example.org" or "https://a.com,https://b.com"
      #   - list: ["https://a.com", "https://b.com"]
      allowedOrigins: "*"
      # Comma-separated list of allowed headers.
      # APISIX constraint: When allowCredentials=true, cannot use "*" for origins, headers, or expose_headers.
      allowedHeaders: "*"
      # Comma-separated list of exposed headers.
      exposedHeaders: "*"
      # Comma-separated list of allowed methods for CORS requests.
      allowedMethods: "GET,HEAD,PUT,PATCH,POST,DELETE,OPTIONS"
      # Allow credentials (cookies, authorization headers)
      allowCredentials: true
      # Preflight cache max age (seconds).
      maxAge: 3600
    postgres:
      enabled: true
      # Database host
      host: &pgHost iam-postgresql
      # Name of the database
      database: &pgDatabase keycloak
      # Username of Keycloak PostgreSQL user. Ignored if secretRef is set.
      username: keycloak
      # Password of Keycloak PostgreSQL user. Autogenerated if omitted.
      # Ignored if secretRef is set or useSecretGenerator is true.
      password: ""
      # Name of existing secret that contains username and password for PostgreSQL
      secretRef: ""

  opa:
    enabled: true
    # inline: true: Use inline OPA; false: deploy and use OPA in a separate pod.
    # If set to true, opal.client.extraEnv.OPAL_INLINE_OPA_ENABLED must
    # be set to "True" so that inline OPA is actually started.
    inline: false
    createRoute: true
    # "Official" OPA URL (used as root URL for the client if one is created)
    url: https://iam-opa.develop.eoepca.org
    hosts:
      - iam-opa.develop.eoepca.org
    paths:
      - /*
    # Array of path prefixes to strip. Useful for path-based routing.
    stripPaths: ~
    # Client credentials:
    # clientId is mandatory if clientSecretRef is *not* specified.
    clientId: opa
    # clientSecret: Client secret as plain text (generated internally if omitted)
    clientSecret: ""
    # clientSecretRef: Name of an existing secret that contains the client secret and maybe further values like the client ID
    clientSecretRef: ""
    # OPA image to pull.
    # Note: This does not have an effect if inline OPA is used.
    image:
      registry: docker.io
      repository: openpolicyagent/opa
      tag: 1.7.1
      pullPolicy: IfNotPresent
  apisix:
    enabled: false
    # Ingress class name for APISIX. Also used for ingressClassName attribute of routes etc.
    # Defaults to "apisix"
    ingressClassName: &ingressClassName apisix
  config:
    # Set this to true in order to apply iam-bb-config as a subchart.
    # If set to false, iam-bb-config must be applied separately if needed.
    enabled: false
    # Allows specifying a deviating namespace to which Crossplane resources
    # shall be installed.
    # This parameter is also taken into account by the main Helm chart if
    # iam.keycloak.configuration.createSecretStore is set to "auto".
    # Note: The namespace must already exist. It is not created by the Helm chart.
    targetNamespace: ~
    # If a target namespace is specified and this parameter is true, the config Helm
    # chart generates external secrets in the target namespace, which effectively
    # creates a copy of the provider and opa-route secrets in the management namespace.
    # This parameter is also taken into account by the main Helm chart if
    # iam.keycloak.configuration.createSecretStore is set to "auto".
    # Note that this requires External Secrets Operator to be installed.
    propagateSecrets: true

# ----

keycloak-operator:
  operator:
    #enabled: false
    replicaCount: 1
  keycloak:
    enabled: true
    instances: 1
    db:
      vendor: postgres
      host: *pgHost #iam-postgresql
      port: 5432
      database: *pgDatabase #keycloak
      #url: jdbc:postgres
      usernameSecret:
        name: postgresql
        key: username
      passwordSecret:
        name: postgresql
        key: password
    http:
      #httpPort: 80
      #httpsPort: 443
      tlsSecret: *tlsSecretRef
    hostname:
      hostname: *kcurl #https://iam-auth-test.eoepca.net.werum
    ingress:
      # Deactivate generation of Ingress resource by operator Helm chart
      enabled: false
    proxy:
      headers: xforwarded
    realmimport:
      # Deactivate generation of KeycloakRealmImport resource by operator Helm chart
      enabled: false

