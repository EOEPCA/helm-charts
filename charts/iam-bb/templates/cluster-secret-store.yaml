{{ $propagateSecrets := and .Values.iam.config.propagateSecrets .Values.iam.config.targetNamespace -}}
{{ if and .Values.iam.keycloak.configuration.createSecretStore (or $propagateSecrets (ne .Values.iam.keycloak.configuration.createSecretStore "auto") ) -}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: eso-store-iam
  namespace: {{ .Release.Namespace }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: eso-store-reader
  namespace: {{ .Release.Namespace }}
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["authorization.k8s.io"]
    resources: ["selfsubjectrulesreviews"]
    verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: eso-store-reader-binding
  namespace: {{ .Release.Namespace }}
subjects:
  - kind: ServiceAccount
    name: eso-store-iam
    namespace: {{ .Release.Namespace }}
roleRef:
  kind: Role
  name: eso-store-reader
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: iam-secret-store
spec:
  provider:
    kubernetes:
      remoteNamespace: {{ .Release.Namespace }}
      server:
        caProvider:
          key: ca.crt
          name: kube-root-ca.crt
          namespace: {{ .Release.Namespace }}
          type: ConfigMap
        url: kubernetes.default
      auth:
        serviceAccount:
          name: eso-store-iam
          namespace: {{ .Release.Namespace }}
  conditions:
    - namespaces:
{{- if .Values.iam.keycloak.configuration.secretStoreClientNamespaces -}}
{{ range .Values.iam.keycloak.configuration.secretStoreClientNamespaces }}
        - {{ . | quote }}
{{- end }}
{{- else }}
        - {{ .Values.iam.config.targetNamespace | default .Release.Namespace }}
{{ end -}}
{{ end -}}
