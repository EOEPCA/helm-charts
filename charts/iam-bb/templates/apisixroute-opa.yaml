{{ if .Values.iam.opa.enabled -}}
{{ if .Values.iam.opa.createRoute -}}
apiVersion: apisix.apache.org/v2
kind: ApisixRoute
metadata:
  name: opa-route
spec:
  ingressClassName: {{ .Values.iam.apisix.ingressClassName }}
  http:
  - name: opa
    match:
      hosts: {{- .Values.iam.opa.hosts | toYaml | nindent 6 }}
      paths: {{- .Values.iam.opa.paths | toYaml | nindent 6 }}
    backends:
      - serviceName: iam-opa #{{ printf "%s-opal-client" .Release.Name }}
        servicePort: 8181
    plugins:
      - name: openid-connect
        enable: true
        config:
{{- if .Values.iam.opa.clientId }}
          client_id: {{ .Values.iam.opa.clientId | quote }}
{{- end }}
          access_token_in_authorization_header: true
          use_jwks: true
          use_pkce: true
          discovery: {{ printf "%s/realms/%s/.well-known/openid-configuration" .Values.iam.keycloak.url .Values.iam.keycloak.configuration.realm.name | quote }}
          claim_validator:
            audience:
              required: true
              match_with_client_id: true
        secretRef: {{ .Values.iam.opa.clientSecretRef | default "opa-route" | quote }}
{{- if .Values.iam.opa.stripPaths }}
      - name: proxy-rewrite
        enable: true
        config:
          regex_uri:
{{- range .Values.iam.opa.stripPaths }}
            - {{ printf "^(%s)$" . }}
            - /
            - {{ printf "^(%s)(/.*)" . }}
            - $2
{{- end }}
{{- end }}
{{- end }}
{{- end }}